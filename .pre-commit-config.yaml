# copied from es-tools, copied from story-indexer
# just mypy (no formatting)
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # re-resolve X.Y.latest tags to git hashes, refresh .venv
  - repo: local
    hooks:
      - id: relock/install
        name: make relock install
        entry: make relock install
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args: ["--in-place", "--remove-unused-variables", "--remove-all-unused-imports"]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: []
        language: system
        types: [python]
        require_serial: true

# NOTE! omits deprecated providers AND nsa client library
exclude: "/test"


